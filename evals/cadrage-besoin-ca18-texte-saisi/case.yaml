schema_version: "1.1"
name: cadrage-besoin-ca18-texte-saisi
description: >-
  Spec 004, CA18 : le texte d'une demande est saisi dans la commande au lieu d'un
  chemin de fichier ; l'outil indique que seules des sources sous forme de fichier
  sont acceptées et n'écrit aucun livrable.
tags: [wf-cadrage-besoin, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Skill, Read, Glob, Grep, Write, Bash]

context:
  scaffold_script: scaffold.sh
