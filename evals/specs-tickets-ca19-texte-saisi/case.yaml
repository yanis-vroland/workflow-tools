schema_version: "1.1"
name: specs-tickets-ca19-texte-saisi
description: >-
  Spec 006, CA19 : le texte d'une demande est saisi dans la commande au lieu d'un
  chemin de fichier, dans un projet qui contient pourtant un cadrage. L'outil
  indique que le texte saisi n'est pas accepté et n'écrit aucun livrable.
tags: [wf-specs-tickets, spec-006, hors-reseau]
