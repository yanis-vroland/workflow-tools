schema_version: "1.1"
name: doc-projet-ca12-dossier-vers-fichier
description: >-
  Spec 002 (wf-doc-projet), CA12, cas limite. Livrable existant au format
  dossier (docs/wf/doc-projet/, commité), projet devenu web seul : la relance
  produit le fichier unique docs/wf/doc-projet.md et supprime l'ancien dossier.
tags: [wf-doc-projet, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Bash, Skill]

context:
  scaffold_script: scaffold.sh

# Limite de claude plugin eval : file_exists ne voit que les fichiers créés
# pendant l'exécution. L'absence de l'ancien dossier, créé par le scaffold, ne
# peut donc pas être vérifiée directement ; on vérifie qu'une commande de
# suppression (rm) vise
# chacun des cinq fichiers connus, puis que rmdir retire le dossier.
graders:
  - name: ca12-fichier-unique-cree
    type: file_exists
    path: "docs/wf/doc-projet.md"
  # Les cinq fichiers connus, chacun argument direct de rm, puis rmdir
  - name: ca12-ancien-index-supprime
    type: tool_used
    tool: Bash
    input_match: '\brm\s+(?:-[\w-]*\s+)*(?:(?:\\?["''])?[^\s;&|]+\s+)*?(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf/doc-projet/index\.md(?=[\s;&|"''\\]|$)'
  - name: ca12-ancien-installation-supprime
    type: tool_used
    tool: Bash
    input_match: '\brm\s+(?:-[\w-]*\s+)*(?:(?:\\?["''])?[^\s;&|]+\s+)*?(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf/doc-projet/installation\.md(?=[\s;&|"''\\]|$)'
  - name: ca12-ancien-configuration-supprime
    type: tool_used
    tool: Bash
    input_match: '\brm\s+(?:-[\w-]*\s+)*(?:(?:\\?["''])?[^\s;&|]+\s+)*?(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf/doc-projet/configuration\.md(?=[\s;&|"''\\]|$)'
  - name: ca12-ancien-fonctionnalites-supprime
    type: tool_used
    tool: Bash
    input_match: '\brm\s+(?:-[\w-]*\s+)*(?:(?:\\?["''])?[^\s;&|]+\s+)*?(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf/doc-projet/fonctionnalites\.md(?=[\s;&|"''\\]|$)'
  - name: ca12-ancien-structure-supprime
    type: tool_used
    tool: Bash
    input_match: '\brm\s+(?:-[\w-]*\s+)*(?:(?:\\?["''])?[^\s;&|]+\s+)*?(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf/doc-projet/structure\.md(?=[\s;&|"''\\]|$)'
  - name: ca12-ancien-dossier-retire-par-rmdir
    type: tool_used
    tool: Bash
    input_match: '\brmdir\s+(?:-[\w-]*\s+)*(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf/doc-projet/?(?=[\s;&|"''\\]|$)'
  # Pas de suppression récursive : elle effacerait les fichiers ajoutés à la main
  - name: ca12-ancien-dossier-pas-de-rm-recursif
    type: tool_used
    tool: Bash
    input_match: '\brm\s+(?:-[\w-]*\s+)*?-\w*[rR]\w*\s+(?:[^;&|"\\]|\\[^n])*?docs/wf/doc-projet/?(?:\*)?(?=[\s;&|"''\\]|$)'
    min: 0
    max: 0
  - name: ca12-aucun-fichier-cree-dans-l-ancien-dossier
    type: file_exists
    path: "docs/wf/doc-projet/**"
    exists: false
  - name: ca12-aucune-ecriture-dans-l-ancien-dossier
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*docs/wf/doc-projet/'
    min: 0
    max: 0
  - name: ca01-aucune-ecriture-hors-docs-wf
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*docs/wf/)'
    min: 0
    max: 0
  # Aucune écriture par Bash hors de docs/wf/ : sed -i, redirection (sauf
  # /dev/null), tee, mv, cp, rm, touch, mkdir, installation des dépendances,
  # exécution du projet, git qui modifie l'arbre. Couvre aussi le README (CA13).
  - name: ca01-aucune-ecriture-bash-hors-docs-wf
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?(?:(?<![=<>-])&?>>?\s*(?!(?:\\?["''])?(?:/dev/(?:null|stdout|stderr)\b|&\d|[(=]))(?!(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf(?=[/\s;&|"''\\]|$))(?:\\?["''])?[^\s;&|"''\\()]|(?<=(?:"command"\s*:\s*"|[;&|(]|\\n|\bxargs(?:\s+-\S+)*|-exec|\bsudo|\btime)\s*)(?:tee\s+(?:-[\w-]+\s+)*(?!(?:\\?["''])?/dev/(?:null|stdout|stderr)\b)(?!(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf(?=[/\s;&|"''\\]|$))(?:\\?["''])?[^\s;&|"''\\]|(?:mv|cp|rm|rmdir|touch|mkdir|ln|truncate|install|unlink|chmod|chown)\s(?:[^;&|"\\]|\\[^n])*?(?<=\s)(?!-)(?!\d*>)(?!(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf(?=[/\s;&|"''\\]|$))(?:\\?["''])?[^\s;&|"''\\-]|(?:sed|perl)(?:(?!docs/wf)(?:[^;&"\\]|\\[^n]))*?\s-(?:[a-zA-Z]*i[a-zA-Z.]*|-in-place)(?=[\s=''"\\]|$)(?:(?!docs/wf)(?:[^;&"\\]|\\[^n]))*(?=[;&"]|\\n|$)|(?:(?:fvm\s+)?(?:flutter|dart)\s+(?:pub\s+(?:get|upgrade|add|remove|downgrade)|packages\s+get|create|build|run|test|clean|format|fix|gen-l10n)|(?:npm|pnpm|yarn|bun)\s+(?:install|i|ci|add|update|upgrade|up|uninstall|remove|rm|run|run-script|test|t|start|exec|rebuild|link|init|audit\s+fix)|yarn|pnpm|npx|pnpx|bunx|pip3?\s+install|composer\s+(?:install|update|require)|bundle(?:\s+install)?|docker(?:-compose|\s+compose)?\s+(?:run|up|build|exec|create)|git\s+(?:add|commit|checkout|switch|restore|reset|stash(?!\s+(?:list|show))|clean|mv|rm|init|apply|am|merge|rebase|cherry-pick|pull|fetch|push|worktree\s+add|branch\s+(?!-)|tag\s+(?!-)))(?=[\s;&|)]|\\n|"|$)|make(?=\s*(?:[;&|)"]|\\n|$)|\s+[\w.-])))'
    min: 0
    max: 0
