schema_version: "1.1"
name: doc-projet-ca12-dossier-vers-fichier
description: >-
  Spec 002 (wf-doc-projet), CA12, cas limite. Livrable existant au format
  dossier (docs/wf/doc-projet/, commité), projet devenu web seul : la relance
  produit le fichier unique docs/wf/doc-projet.md et supprime l'ancien dossier.
tags: [wf-doc-projet, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Bash, Skill]

context:
  scaffold_script: scaffold.sh

# Limite de claude plugin eval : file_exists ne voit que les fichiers créés
# pendant l'exécution. L'absence de l'ancien dossier, créé par le scaffold, ne
# peut donc pas être vérifiée directement ; on vérifie qu'une commande de
# suppression le vise.
graders:
  - name: ca12-fichier-unique-cree
    type: file_exists
    path: "docs/wf/doc-projet.md"
  - name: ca12-ancien-dossier-supprime
    type: tool_used
    tool: Bash
    input_match: '\b(?:rm|unlink|mv)\b[^"]*docs/wf/doc-projet/?\*?(?:\\?"|[\s;&|)]|$)'
  - name: ca12-aucun-fichier-cree-dans-l-ancien-dossier
    type: file_exists
    path: "docs/wf/doc-projet/**"
    exists: false
  - name: ca12-aucune-ecriture-dans-l-ancien-dossier
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*docs/wf/doc-projet/'
    min: 0
    max: 0
  - name: ca01-aucune-ecriture-hors-docs-wf
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*docs/wf/)'
    min: 0
    max: 0
