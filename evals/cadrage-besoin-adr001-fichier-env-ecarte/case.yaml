schema_version: "1.1"
name: cadrage-besoin-adr001-fichier-env-ecarte
description: >-
  Spec 004 et ADR-001 (aucun fichier d'environnement lu) : un fichier dont le nom
  commence par .env (.env.md, extension pourtant acceptée) est passé en argument
  avec un brief lisible ; il est écarté sans être ouvert, et le livrable est
  écrit à partir du brief seul.
tags: [wf-cadrage-besoin, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Write, Bash]

context:
  scaffold_script: scaffold.sh
