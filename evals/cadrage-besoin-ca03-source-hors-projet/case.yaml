schema_version: "1.1"
name: cadrage-besoin-ca03-source-hors-projet
description: >-
  Spec 004, CA3 (ADR-001, amendement 1) : la source est hors du projet et passée
  par un chemin absolu ; l'en-tête « Sources lues » la désigne par son chemin
  relatif à la racine du projet (../…), et aucun chemin absolu n'apparaît dans
  le livrable.
tags: [wf-cadrage-besoin, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Skill, Read, Glob, Grep, Write, Bash]

context:
  scaffold_script: scaffold.sh
