schema_version: "1.1"
name: analyse-projet-ca15-depot-parent-non-suivi
description: >-
  Spec 001, CA15 (et frontière de CA20) : copie de FieldOps dans le dossier
  d'un dépôt git parent qui a des commits mais ne suit pas ce dossier. Le
  projet est « hors git » : pas de commit dans l'en-tête, « Activité du
  dépôt » non applicable.
tags: [analyse-projet, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill, WebFetch]

context:
  scaffold_script: scaffold.sh
