schema_version: "1.1"
name: publication-store-ca18-ca19-ca20-ca22-fastlane
description: >-
  Spec 015 (wf-publication-store) sur FieldOps complet avec des métadonnées
  fastlane en français (description courte Android trop longue) et des notes
  de version dont la section la plus récente (1.3.0) diffère de la version du
  pubspec.yaml (1.2.0). Couvre CA18 (reprise des métadonnées), CA19 (reprise
  des Nouveautés), CA20 (divergence de version), CA22 (limites) et CA1
  (métadonnées non modifiées).
tags: [wf-publication-store, spec-015, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill, WebFetch]

context:
  scaffold_script: scaffold.sh

graders:
  - name: temoin-livrable-cree
    type: file_exists
    path: "docs/wf/publication-store.md"

  # --- CA1 : ni les métadonnées ni les notes de version ne sont modifiées ----------
  - name: ca01-aucune-ecriture-hors-livrable
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*docs/wf/publication-store\.md")'
    min: 0
    max: 0
  - name: ca01-aucune-edition-hors-livrable
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?![^"]*docs/wf/publication-store\.md")'
    min: 0
    max: 0
  - name: ca01-bash-liste-blanche
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?!(?:git rev-parse --short HEAD|git status --porcelain|date \+%F|git ls-files -- ''\*key\.properties'' ''\*\.jks'' ''\*\.keystore'' ''\*\.p12'' ''\*\.p8'')")'
    min: 0
    max: 0

  # --- CA18 : reprise des métadonnées, fichiers cités, pas de brouillon -------------
  - name: ca18-sous-titre-ios-repris-et-cite
    type: regex
    target: { source: file, path: "docs/wf/publication-store.md" }
    pattern: '\n## [^\n]*Fiches store[^\n]*\n(?=(?:(?!\n## )[\s\S])*?Interventions sur le terrain)(?=(?:(?!\n## )[\s\S])*?fastlane/metadata/fr-FR/subtitle\.txt)'
  - name: ca18-mots-cles-ios-repris-et-cites
    type: regex
    target: { source: file, path: "docs/wf/publication-store.md" }
    pattern: '\n## [^\n]*Fiches store[^\n]*\n(?=(?:(?!\n## )[\s\S])*?intervention,technicien,planning)(?=(?:(?!\n## )[\s\S])*?fastlane/metadata/fr-FR/keywords\.txt)'
  - name: ca18-description-courte-android-reprise-et-citee
    type: regex
    target: { source: file, path: "docs/wf/publication-store.md" }
    pattern: '\n## [^\n]*Fiches store[^\n]*\n(?=(?:(?!\n## )[\s\S])*?Planning du jour, détail des interventions)(?=(?:(?!\n## )[\s\S])*?fastlane/metadata/android/fr-FR/short_description\.txt)'
  - name: ca18-pas-de-brouillon
    type: regex
    target: { source: file, path: "docs/wf/publication-store.md" }
    pattern: 'brouillon à valider'
    match: not_contains

  # --- CA19 : Nouveautés de la section la plus récente, titre cité -----------------
  - name: ca19-nouveautes-reprises
    type: regex
    target: { source: file, path: "docs/wf/publication-store.md" }
    pattern: '\n## [^\n]*Fiches store[^\n]*\n(?:(?!\n## )[\s\S])*?Nouveautés de cette version(?=(?:(?!\n## )[\s\S])*?Le client signe le compte rendu directement sur le téléphone)(?=(?:(?!\n## )[\s\S])*?Les photos d.une intervention peuvent être annotées)'
  - name: ca19-titre-de-section-cite
    type: regex
    target: { source: file, path: "docs/wf/publication-store.md" }
    pattern: '\n## [^\n]*Fiches store[^\n]*\n(?:(?!\n## )[\s\S])*?Version 1\.3\.0 \(2026-10-05\)'
  - name: ca19-section-ancienne-non-reprise
    type: regex
    target: { source: file, path: "docs/wf/publication-store.md" }
    pattern: 'restent disponibles hors réseau'
    match: not_contains
  - name: ca19-corrections-non-reprises
    type: regex
    target: { source: file, path: "docs/wf/publication-store.md" }
    pattern: 'changement de fuseau horaire'
    match: not_contains

  # --- CA20 : notes de version 1.3.0 pour l'application 1.2.0 -----------------------
  - name: ca20-divergence-signalee
    type: regex
    target: { source: file, path: "docs/wf/publication-store.md" }
    pattern: '\n## [^\n]*Fiches store[^\n]*\n(?:(?!\n## )[\s\S])*?[àÀ] vérifier : notes de version 1\.3\.0 pour l.application 1\.2\.0(?!\+)'

  # --- CA22 : décompte et limite dépassée ---------------------------------------------
  - name: ca22-description-courte-depasse-la-limite
    type: regex
    target: { source: file, path: "docs/wf/publication-store.md" }
    pattern: '\n## [^\n]*Fiches store[^\n]*\n(?:(?!\n## )[\s\S])*?\d+\s*caractères?\s*/\s*limite\s*80\b[^\n]*dépasse la limite'
  - name: ca22-limites-des-nouveautes
    type: regex
    target: { source: file, path: "docs/wf/publication-store.md" }
    pattern: '\n## [^\n]*Fiches store[^\n]*\n(?=(?:(?!\n## )[\s\S])*?limite\s*500\b)(?=(?:(?!\n## )[\s\S])*?limite\s*4\s?000\b)'
  # Regex plutôt qu'un juge llm, bruité sur ce long livrable (8 900 caractères)
  - name: ca22-decomptes-des-fiches
    type: regex
    target: { source: file, path: "docs/wf/publication-store.md" }
    pattern: '\n## [^\n]*Fiches store[^\n]*\n(?=(?:(?!\n## )[\s\S])*?FieldOps Technicien[^\n]*\d+\s*caractères?\s*/\s*limite\s*30\b)(?=(?:(?!\n## )[\s\S])*?Interventions sur le terrain[^\n]*\d+\s*caractères?\s*/\s*limite\s*30\b)(?=(?:(?!\n## )[\s\S])*?photos[^\n]*\d+\s*caractères?\s*/\s*limite\s*100\b)(?=(?:(?!\n## )[\s\S])*?fr-FR/description\.txt[^\n]*\d+\s*caractères?\s*/\s*limite\s*4\s?000\b)(?=(?:(?!\n## )[\s\S])*?full_description\.txt[^\n]*\d+\s*caractères?\s*/\s*limite\s*4\s?000\b)'
  # Seule la description courte Android (126 caractères) dépasse sa limite
  - name: ca22-une-seule-limite-depassee
    type: regex
    target: { source: file, path: "docs/wf/publication-store.md" }
    pattern: 'dépasse la limite[\s\S]*dépasse la limite'
    match: not_contains
