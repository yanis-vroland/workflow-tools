schema_version: "1.1"
name: recette-ca09-ca10-relance
description: >-
  Spec 014 (wf-recette). FieldOps avec un cahier de recette déjà commité dont
  des statuts et commentaires ont été saisis à la main : relance,
  conservation des identifiants, statuts et commentaires, identifiants jamais
  réutilisés, cas dont la source a disparu retirés et listés. Couvre CA9,
  CA10, CA8, CA14, CA3.
tags: [wf-recette, spec-014, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Bash, Skill]

context:
  scaffold_script: scaffold.sh
