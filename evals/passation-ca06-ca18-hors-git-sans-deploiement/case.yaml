schema_version: "1.1"
name: passation-ca06-ca18-hors-git-sans-deploiement
description: >-
  Spec 016 (wf-passation). Copie de FieldOps hors git, sans aucune
  configuration de déploiement (ni workflow, ni Dockerfile, ni
  docker-compose) ; le README annonce pourtant un déploiement par GitHub
  Actions. Couvre CA6, CA18, CA8 (secrets de .env.example seuls), CA21.
tags: [wf-passation, spec-016, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill]

context:
  scaffold_script: scaffold.sh
