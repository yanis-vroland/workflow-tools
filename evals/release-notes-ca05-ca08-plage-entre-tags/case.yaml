schema_version: "1.1"
name: release-notes-ca05-ca08-plage-entre-tags
description: >-
  Spec 009 (wf-release-notes) avec deux références en argument (v1.1.0 v1.2.0) :
  plage de v1.1.0 (exclu) à v1.2.0 (inclus), cinq feat, un fix, un test, un
  docs. Couvre CA1 à CA3 (commit de la borne haute), CA5, CA6, CA8, CA11, CA12,
  CA25.
tags: [wf-release-notes, spec-009, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 60
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill]

context:
  scaffold_script: scaffold.sh

graders:
  - name: ca01-livrable-cree
    type: file_exists
    path: "docs/wf/release-notes.md"
  # Témoin : sans lui, une liste de fichiers vide ferait passer ca01-aucun-autre-fichier-cree
  - name: temoin-livrable-dans-files
    type: regex
    target: files
    pattern: '^docs/wf/release-notes\.md$'
    flags: "m"
    match: contains
  # CA1 : aucun autre fichier créé ou modifié (ni CHANGELOG.md, ni manifeste)
  - name: ca01-aucun-autre-fichier-cree
    type: regex
    target: files
    pattern: '^(?!docs/wf/release-notes\.md$|\.git/).+$'
    flags: "m"
    match: not_contains
  - name: ca01-write-seulement-livrable
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*docs/wf/release-notes\.md")'
    min: 0
    max: 0
  - name: ca01-edit-seulement-livrable
    type: tool_used
    tool: Edit
    input_match: '"file_path"\s*:\s*"(?![^"]*docs/wf/release-notes\.md")'
    min: 0
    max: 0
  # CA1 : aucune écriture par Bash hors de docs/wf/, aucun git tag, commit, add, checkout…
  - name: ca01-aucune-ecriture-bash-ni-tag
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?(?:(?<![=<>-])&?>>?\s*(?!(?:\\?["''])?(?:/dev/(?:null|stdout|stderr)\b|&\d|[(=]))(?!(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf(?=[/\s;&|"''\\]|$))(?:\\?["''])?[^\s;&|"''\\()]|(?<=(?:"command"\s*:\s*"|[;&|(]|\\n|\bxargs(?:\s+-\S+)*|-exec|\bsudo|\btime)\s*)(?:tee\s+(?:-[\w-]+\s+)*(?!(?:\\?["''])?/dev/(?:null|stdout|stderr)\b)(?!(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf(?=[/\s;&|"''\\]|$))(?:\\?["''])?[^\s;&|"''\\]|(?:mv|cp|rm|rmdir|touch|mkdir|ln|truncate|install|unlink|chmod|chown)\s(?:[^;&|"\\]|\\[^n])*?(?<=\s)(?!-)(?!\d*>)(?!(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf(?=[/\s;&|"''\\]|$))(?:\\?["''])?[^\s;&|"''\\-]|(?:sed|perl)(?:(?!docs/wf)(?:[^;&"\\]|\\[^n]))*?\s-(?:[a-zA-Z]*i[a-zA-Z.]*|-in-place)(?=[\s=''"\\]|$)(?:(?!docs/wf)(?:[^;&"\\]|\\[^n]))*(?=[;&"]|\\n|$)|(?:(?:fvm\s+)?(?:flutter|dart)\s+(?:pub\s+(?:get|upgrade|add|remove|downgrade)|packages\s+get|create|build|run|test|clean|format|fix|gen-l10n)|(?:npm|pnpm|yarn|bun)\s+(?:install|i|ci|add|update|upgrade|up|uninstall|remove|rm|run|run-script|test|t|start|exec|rebuild|link|init|audit\s+fix)|yarn|pnpm|npx|pnpx|bunx|pip3?\s+install|composer\s+(?:install|update|require)|bundle(?:\s+install)?|docker(?:-compose|\s+compose)?\s+(?:run|up|build|exec|create)|git\s+(?:add|commit|checkout|switch|restore|reset|stash(?!\s+(?:list|show))|clean|mv|rm|init|apply|am|merge|rebase|cherry-pick|pull|fetch|push|worktree\s+add|branch\s+(?!-)|tag\s+(?!-)))(?=[\s;&|)]|\\n|"|$)|make(?=\s*(?:[;&|)"]|\\n|$)|\s+[\w.-])))'
    min: 0
    max: 0
  - name: ca03-en-tete-outil
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '^(?:(?!\n## )[\s\S])*?wf-release-notes'
    match: contains
  - name: ca03-en-tete-date
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '^(?:(?!\n## )[\s\S])*?\b\d{4}-\d{2}-\d{2}\b'
    match: contains
  # CA3 : commit analysé = borne haute de la plage (b5808fe, rejouable)
  - name: ca03-en-tete-commit-borne-haute
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '^(?:(?!\n## )[\s\S])*?\bb5808fe\b'
    match: contains
  - name: adr001-arbre-propre-sans-mention
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: 'modifications non commitées'
    match: not_contains
  # CA3 : l'en-tête cite la borne haute (v1.2.0), pas HEAD
  - name: ca03-en-tete-pas-head
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '^(?:(?!\n## )[\s\S])*?\b5b26289\b'
    match: not_contains
  - name: ca02-titre-version
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\n## Version 1\.2\.0 \(\d{4}-\d{2}-\d{2}\)\n'
    match: contains
  - name: ca02-sous-sections-dans-l-ordre
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\n### Nouveautés[^\n]*\n[\s\S]*\n### Corrections[^\n]*\n[\s\S]*\n### Références'
    match: contains
  - name: ca02-sous-sections-vides-omises
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\n### (?:Améliorations|Points d''attention)\b'
    match: not_contains
  - name: ca05-tous-les-commits-de-la-plage
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\n### Références[^\n]*\n(?=(?:(?!\n###? )[\s\S])*?\bd5f01f1\b)(?=(?:(?!\n###? )[\s\S])*?\bddd6bb2\b)(?=(?:(?!\n###? )[\s\S])*?\bcd1b7dd\b)(?=(?:(?!\n###? )[\s\S])*?\b66766a8\b)(?=(?:(?!\n###? )[\s\S])*?\bbf04dba\b)(?=(?:(?!\n###? )[\s\S])*?\b804fb80\b)(?=(?:(?!\n###? )[\s\S])*?\bc062680\b)(?=(?:(?!\n###? )[\s\S])*?\bb5808fe\b)'
    match: contains
  # CA5 : v1.1.0 (7cf46aa) exclu, rien après v1.2.0
  - name: ca05-bornes-respectees
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\b(?:7cf46aa|a39d2bd|da56e50|5b26289)\b'
    match: not_contains
  - name: ca12-chaque-commit-une-seule-fois
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\n### Références[^\n]*\n(?:(?!\n###? )[\s\S])*?\b(d5f01f1|ddd6bb2|cd1b7dd|66766a8|bf04dba|804fb80|c062680|b5808fe)\b(?:(?!\n###? )[\s\S])*?\b\1\b'
    match: not_contains
  - name: ca08-fix-dans-corrections
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\n### Corrections[^\n]*\n(?:(?!\n###? )[\s\S])*?TVA'
    match: contains
  - name: ca08-fix-rattache-a-corrections
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\n### Références[^\n]*\n(?:(?!\n###? )[\s\S])*?(?<=\n)(?=[^\n]*\b66766a8\b)(?=[^\n]*Corrections)'
    match: contains
  - name: ca08-feat-dans-nouveautes
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\n### Nouveautés[^\n]*\n(?:(?!\n###? )[\s\S])*?\biOS\b'
    match: contains
  - name: ca08-feat-rattache-a-nouveautes
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\n### Références[^\n]*\n(?:(?!\n###? )[\s\S])*?(?<=\n)(?=[^\n]*\bd5f01f1\b)(?=[^\n]*Nouveautés)'
    match: contains
  - name: ca08-test-sans-entree
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\n### Références[^\n]*\n(?:(?!\n###? )[\s\S])*?(?<=\n)(?=[^\n]*\bc062680\b)(?=[^\n]*sans entrée)(?=[^\n]*\btest\b)'
    match: contains
  - name: ca08-docs-sans-entree
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\n### Références[^\n]*\n(?:(?!\n###? )[\s\S])*?(?<=\n)(?=[^\n]*\bb5808fe\b)(?=[^\n]*sans entrée)(?=[^\n]*\bdocs\b)'
    match: contains
  - name: ca06-manifeste-cite
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\n## Version 1\.2\.0 \([^\n]*\n(?:(?!\n## )[\s\S])*?package\.json'
    match: contains
  # CA11 : ni hash de commit ni chemin de fichier dans Nouveautés, Améliorations, Corrections, Points d'attention
  - name: ca11-ni-hash-ni-chemin-dans-les-entrees
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '\n### (?:Nouveautés|Améliorations|Corrections|Points d''attention)[^\n]*\n(?:(?!\n###? )[\s\S])*?(?:\b(?=[0-9a-f]*\d)(?=[0-9a-f]*[a-f])[0-9a-f]{7,40}\b|\b[\w./-]+\.(?:ts|tsx|js|jsx|mjs|dart|json|ya?ml|sql|md|gradle|plist)\b)'
    match: not_contains
  # CA25 : aucun des quatre auteurs fictifs de l'historique
  - name: ca25-aucun-nom-de-contributeur
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: 'Marchetti|Brassac|Belkacem|Vasseur|\bL[ée]a\b|\bHugo\b|\bNora\b|\bTh[ée]o\b|\bFieldOps <'
    match: not_contains
  - name: ca25-aucune-adresse-email
    type: regex
    target: { source: file, path: "docs/wf/release-notes.md" }
    pattern: '[A-Za-z0-9._%+-]+@(?:[A-Za-z0-9-]+\.)+[A-Za-z]{2,}\b'
    match: not_contains
  # Témoin : le fichier d'environnement local existe (ADR-001)
  - name: temoin-secret-local-genere
    type: regex
    target: { source: file, path: ".env" }
    pattern: 'FIELDOPS_FAUX_SECRET_7f3a'
    match: contains
  - name: adr001-secret-local-absent-trace
    type: regex
    target: trace
    pattern: 'FIELDOPS_FAUX_SECRET_7f3a'
    match: not_contains
  - name: ca08-classement
    type: llm
    focus: { source: file, path: "docs/wf/release-notes.md" }
    criteria: |
      CA8. Plage v1.1.0..v1.2.0 de FieldOps : feat « prise en charge d'iOS », feat
      « envoi du compte rendu au client à la clôture », feat « acompte en ligne sur
      un ordre de travail », feat « cache local des interventions », feat
      « suppression d'une intervention annulée », fix « TVA calculée après remise et
      déplacement », test et docs.

      Réussite si toutes les affirmations suivantes sont vraies :
      1. « Nouveautés » couvre les cinq fonctionnalités (éventuellement regroupées
         si elles portent sur la même), et rien d'autre.
      2. « Corrections » ne contient que la correction du calcul de TVA.
      3. Les commits test et docs ne produisent aucune entrée.
      4. Aucune entrée n'est inventée (aucune fonctionnalité absente de cette liste).
  - name: ca11-lecteur-non-developpeur
    type: llm
    focus: { source: file, path: "docs/wf/release-notes.md" }
    criteria: |
      CA11. Réussite si toutes les entrées de « Nouveautés », « Améliorations »,
      « Corrections » et « Points d'attention » sont rédigées pour un client ou un
      utilisateur non développeur : phrases compréhensibles sans connaître le code,
      sans chemin de fichier, sans nom de fonction ou de classe, sans hash de commit,
      sans préfixe Conventional Commits (feat, fix, scope entre parenthèses).
      La sous-section « Références » n'est pas concernée.
