schema_version: "1.1"
name: publication-store-ca04-expo
description: >-
  Spec 015 (wf-publication-store), CA4 : application Expo en flux géré (ni ios/
  ni android/, configuration dans app.json), sans application Flutter. L'outil
  indique « Expo non couvert en v1 » et n'écrit aucun livrable.
tags: [wf-publication-store, spec-015, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 20
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Write, Bash, Skill, WebFetch]

context:
  scaffold_script: scaffold.sh

graders:
  - name: ca04-aucun-livrable
    type: file_exists
    path: "docs/wf/publication-store.md"
    exists: false
  - name: ca04-aucun-fichier-cree
    type: regex
    target: files
    pattern: '^(?!\.git/).+$'
    flags: m
    match: not_contains
  - name: ca04-aucune-ecriture
    type: tool_used
    tool: Write
    min: 0
    max: 0
  # Témoin positif : sans lui, les correcteurs d'absence réussiraient même si la
  # skill ne s'était pas déclenchée. Expo est nommé, pas seulement React Native.
  - name: ca04-message-expo-non-couvert
    type: regex
    target: last_message
    pattern: '\bExpo[^\n]{0,40}non couvert en v1'
    flags: i
  # Une application sans ios/ ni android/ reste une application mobile : ce
  # n'est pas le cas CA5.
  - name: ca04-pas-confondu-avec-ca05
    type: regex
    target: last_message
    pattern: 'aucune application mobile'
    flags: i
    match: not_contains
  - name: ca04-bash-liste-blanche
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?!(?:git rev-parse --short HEAD|git status --porcelain|date \+%F|git ls-files -- ''\*key\.properties'' ''\*\.jks'' ''\*\.keystore'' ''\*\.p12'' ''\*\.p8'')")'
    min: 0
    max: 0
