schema_version: "1.1"
name: tests-manquants-ca05-rapport-recent
description: >-
  Spec 012 (wf-tests-manquants), CA5, variante : FieldOps complet avec un
  rapport de couverture web (coverage/coverage-summary.json) produit au
  lancement, postérieur au dernier commit. Le rapport est exploité, cité avec
  sa date, et n'est pas présenté comme antérieur au dernier commit.
tags: [wf-tests-manquants, spec-012, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 100
  timeout_seconds: 1500
  allowed_tools: [Read, Glob, Grep, Write, Bash, Skill]

context:
  scaffold_script: scaffold.sh

graders:
  - name: ca01-livrable-cree
    type: file_exists
    path: "docs/wf/tests-manquants.md"
  - name: ca05-rapport-cite-avec-sa-date
    type: regex
    target: { source: file, path: "docs/wf/tests-manquants.md" }
    pattern: '\n## [^\n]*Couverture actuelle[^\n]*\n(?:(?!\n## )[\s\S])*?(?<=\n)(?=[^\n]*coverage/coverage-summary\.json)(?=[^\n]*\d{4}-\d{2}-\d{2})'
  - name: ca05-chiffres-du-rapport-repris
    type: regex
    target: { source: file, path: "docs/wf/tests-manquants.md" }
    pattern: '\n## [^\n]*Couverture actuelle[^\n]*\n(?:(?!\n## )[\s\S])*?(?:81[,.]82|18 (?:lignes )?(?:couvertes )?sur 22|18/22)'
  # Témoin inverse de tests-manquants-ca05-rapports-couverture : un rapport
  # récent n'est pas déclaré antérieur au dernier commit ni périmé.
  - name: ca05-rapport-recent-non-dit-anterieur
    type: regex
    target: { source: file, path: "docs/wf/tests-manquants.md" }
    pattern: '\n## [^\n]*Couverture actuelle[^\n]*\n(?:(?!\n## )[\s\S])*?(?:ant[ée]rieur au dernier commit|p[ée]rim[ée])'
    flags: i
    match: not_contains
  - name: adr001-en-tete-outil-date-commit
    type: regex
    target: { source: file, path: "docs/wf/tests-manquants.md" }
    pattern: '^(?=(?:[^\n]*\n){0,10}[^\n]*wf-tests-manquants)(?=(?:[^\n]*\n){0,10}[^\n]*\b2fc99c0)(?=(?:[^\n]*\n){0,10}[^\n]*\d{4}-\d{2}-\d{2})'
  - name: ca07-rapport-non-reecrit
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"[^"]*coverage/'
    min: 0
    max: 0
  - name: ca01-aucune-ecriture-hors-livrable
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*docs/wf/tests-manquants\.md")'
    min: 0
    max: 0
  - name: ca07-aucun-lanceur-ni-installation
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?(?:--coverage\b|(?<=(?:"command"\s*:\s*"|\\n|&&|\|\||;|\s\||(?:"command"\s*:\s*"|[\s$])\(|(?<![\w.-])(?:xargs|env|time|sudo|exec|nohup))\s*(?:[A-Z_][A-Z0-9_]*=\S*\s+)*)(?:npx|pnpx|bunx|vitest|jest|playwright|cypress|mocha|c8|nyc|node|tsx|ts-node|deno|bun|dart|flutter|fvm|npm|pnpm|yarn|python3?|pytest|pip3?)(?=[\s;&|)]|\\n|"|$))'
    min: 0
    max: 0
