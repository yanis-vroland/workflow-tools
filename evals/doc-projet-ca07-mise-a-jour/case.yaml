schema_version: "1.1"
name: doc-projet-ca07-mise-a-jour
description: >-
  Spec 002 (wf-doc-projet), CA7. FieldOps web seul avec un livrable
  docs/wf/doc-projet.md déjà commité : la relance le met à jour au lieu de le
  dupliquer, conserve la section encore exacte et corrige la section périmée,
  dont la « Configuration » à l'ancienne forme, remplacée par le tableau de CA4.
tags: [wf-doc-projet, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 80
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Write, Bash, Skill]

context:
  scaffold_script: scaffold.sh

graders:
  # Aucun autre livrable : ni nouveau fichier sous docs/wf/ (autre que la
  # réécriture éventuelle de doc-projet.md), ni dossier docs/wf/doc-projet/
  - name: ca07-aucun-autre-livrable-cree
    type: regex
    target: files
    pattern: '^(?:.*/)?docs/wf/(?!doc-projet\.md$).+$'
    flags: m
    match: not_contains
  - name: ca07-pas-de-dossier
    type: file_exists
    path: "docs/wf/doc-projet/**"
    exists: false
  - name: ca07-une-seule-section-presentation
    type: regex
    target: { source: file, path: "docs/wf/doc-projet.md" }
    pattern: '(?:^|\n)#{1,6} [^\n]*Présentation'
    match: "count:1"
  # Phrase de l'ancien livrable, toujours exacte (src/db/schema.sql)
  - name: ca07-section-exacte-conservee
    type: regex
    target: { source: file, path: "docs/wf/doc-projet.md" }
    pattern: "Trois rôles d'utilisateur sont définis par la contrainte"
    flags: i
  # « npm run serve » n'existe pas dans package.json
  - name: ca07-section-perimee-corrigee
    type: regex
    target: { source: file, path: "docs/wf/doc-projet.md" }
    pattern: 'npm run serve'
    match: not_contains
  # L'ancien livrable liste les noms des variables sur une ligne (forme d'avant
  # l'amendement de CA4) : la mise à jour la remplace par le tableau
  - name: ca07-ca04-ancienne-liste-remplacee-par-le-tableau
    type: regex
    target: { source: file, path: "docs/wf/doc-projet.md" }
    pattern: '\n#{1,6} [^\n]*Configuration[^\n]*\n(?:(?!\n#{1,6} [^\n]*Fonctionnalités)[\s\S])*?\n\|\s*Variable\s*\|\s*Utilisé pour\s*\|\s*Où la renseigner\s*\|\s*Comment l[’'']obtenir\s*\|'
  - name: ca07-ca04-ancienne-liste-retiree
    type: regex
    target: { source: file, path: "docs/wf/doc-projet.md" }
    pattern: 'Variables listées dans \x60\.env\.example\x60 :'
    match: not_contains
  - name: ca07-installation-commande-reelle
    type: regex
    target: { source: file, path: "docs/wf/doc-projet.md" }
    pattern: '\n#{1,6} [^\n]*Installation et lancement[^\n]*\n(?:(?!\n#{1,6} [^\n]*Configuration)[\s\S])*?npm run dev\b'
  # 81c55c7 : HEAD du scaffold (commit du livrable), rejouable ; l'ancien en-tête
  # citait be04389 et le 2026-10-02
  - name: ca07-en-tete-commit-mis-a-jour
    type: regex
    target: { source: file, path: "docs/wf/doc-projet.md" }
    pattern: '^(?:[^\n]*\n){0,15}[^\n]*\b81c55c7'
  - name: ca07-en-tete-ancienne-date-retiree
    type: regex
    target: { source: file, path: "docs/wf/doc-projet.md" }
    pattern: '^(?:[^\n]*\n){0,15}[^\n]*(?:2026-10-02|be04389)'
    match: not_contains
  - name: ca01-aucune-ecriture-hors-docs-wf
    type: tool_used
    tool: Write
    input_match: '"file_path"\s*:\s*"(?![^"]*docs/wf/)'
    min: 0
    max: 0
  # Aucune écriture par Bash hors de docs/wf/ : sed -i, redirection (sauf
  # /dev/null), tee, mv, cp, rm, touch, mkdir, installation des dépendances,
  # exécution du projet, git qui modifie l'arbre. Couvre aussi le README (CA13).
  - name: ca01-aucune-ecriture-bash-hors-docs-wf
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]|\\.)*?(?:(?<![=<>-])&?>>?\s*(?!(?:\\?["''])?(?:/dev/(?:null|stdout|stderr)\b|&\d|[(=]))(?!(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf(?=[/\s;&|"''\\]|$))(?:\\?["''])?[^\s;&|"''\\()]|(?<=(?:"command"\s*:\s*"|[;&|(]|\\n|\bxargs(?:\s+-\S+)*|-exec|\bsudo|\btime)\s*)(?:tee\s+(?:-[\w-]+\s+)*(?!(?:\\?["''])?/dev/(?:null|stdout|stderr)\b)(?!(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf(?=[/\s;&|"''\\]|$))(?:\\?["''])?[^\s;&|"''\\]|(?:mv|cp|rm|rmdir|touch|mkdir|ln|truncate|install|unlink|chmod|chown)\s(?:[^;&|"\\]|\\[^n])*?(?<=\s)(?!-)(?!\d*>)(?!(?:\\?["''])?(?:[^\s;&|"''\\]*/)?docs/wf(?=[/\s;&|"''\\]|$))(?:\\?["''])?[^\s;&|"''\\-]|(?:sed|perl)(?:(?!docs/wf)(?:[^;&"\\]|\\[^n]))*?\s-(?:[a-zA-Z]*i[a-zA-Z.]*|-in-place)(?=[\s=''"\\]|$)(?:(?!docs/wf)(?:[^;&"\\]|\\[^n]))*(?=[;&"]|\\n|$)|(?:(?:fvm\s+)?(?:flutter|dart)\s+(?:pub\s+(?:get|upgrade|add|remove|downgrade)|packages\s+get|create|build|run|test|clean|format|fix|gen-l10n)|(?:npm|pnpm|yarn|bun)\s+(?:install|i|ci|add|update|upgrade|up|uninstall|remove|rm|run|run-script|test|t|start|exec|rebuild|link|init|audit\s+fix)|yarn|pnpm|npx|pnpx|bunx|pip3?\s+install|composer\s+(?:install|update|require)|bundle(?:\s+install)?|docker(?:-compose|\s+compose)?\s+(?:run|up|build|exec|create)|git\s+(?:add|commit|checkout|switch|restore|reset|stash(?!\s+(?:list|show))|clean|mv|rm|init|apply|am|merge|rebase|cherry-pick|pull|fetch|push|worktree\s+add|branch\s+(?!-)|tag\s+(?!-)))(?=[\s;&|)]|\\n|"|$)|make(?=\s*(?:[;&|)"]|\\n|$)|\s+[\w.-])))'
    min: 0
    max: 0
