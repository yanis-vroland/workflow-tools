schema_version: "1.1"
name: publication-store-ca04-natif-swift
description: >-
  Spec 015 (wf-publication-store), CA4 : application iOS native (Swift, projet
  Xcode), sans pubspec.yaml ni package.json. L'outil indique que l'iOS natif
  (Swift/Xcode) n'est pas couvert en v1 et n'écrit aucun livrable.
tags: [wf-publication-store, spec-015, hors-reseau]
runs: 1

execution:
  model: claude-sonnet-5-5
  max_turns: 20
  timeout_seconds: 400
  allowed_tools: [Read, Glob, Grep, Write, Bash, Skill, WebFetch]

context:
  scaffold_script: scaffold.sh

graders:
  - name: ca04-aucun-livrable
    type: file_exists
    path: "docs/wf/publication-store.md"
    exists: false
  - name: ca04-aucun-fichier-cree
    type: regex
    target: files
    pattern: '^(?!\.git/).+$'
    flags: m
    match: not_contains
  - name: ca04-aucune-ecriture
    type: tool_used
    tool: Write
    min: 0
    max: 0
  # Témoin positif : sans lui, les correcteurs d'absence réussiraient même si la
  # skill ne s'était pas déclenchée.
  - name: ca04-message-natif-non-couvert
    type: regex
    target: last_message
    pattern: '(?:iOS natif|Swift)[^\n]{0,60}non couvert en v1'
    flags: i
  - name: ca04-pas-confondu-avec-ca05
    type: regex
    target: last_message
    pattern: 'aucune application mobile'
    flags: i
    match: not_contains
  - name: ca04-bash-liste-blanche
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?!(?:git rev-parse --short HEAD|git status --porcelain|date \+%F|git ls-files -- ''\*key\.properties'' ''\*\.jks'' ''\*\.keystore'' ''\*\.p12'' ''\*\.p8'')")'
    min: 0
    max: 0
