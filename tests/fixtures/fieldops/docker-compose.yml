services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://fieldops:${POSTGRES_PASSWORD:-changeme}@db:5432/fieldops
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: fieldops
      POSTGRES_DB: fieldops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  pgdata:
