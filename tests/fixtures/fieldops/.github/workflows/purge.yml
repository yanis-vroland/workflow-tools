name: Purge des interventions clôturées

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  purge:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Supprimer les interventions clôturées depuis plus de 24 mois
        run: npx tsx src/jobs/purge-closed-interventions.ts
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
