name: Evals

# Evals des skills (ADR-001) : elles appellent un modèle et coûtent du quota, donc
# elles ne tournent que sur les PR de ce dépôt portant le label « evals »,
# jamais sur une PR venant d'un fork.

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

env:
  # Version de Claude Code fixée, à monter à la main
  CLAUDE_CODE_VERSION: 2.1.291

jobs:
  evals:
    name: Evals des skills
    if: >-
      contains(github.event.pull_request.labels.*.name, 'evals')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation de Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # --no-publish : le rapport ne quitte jamais la CI (confidentialité)
      - name: Lancement des evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          claude plugin eval . --scaffold --trust-plugin --no-publish
          --allow-tools Write Bash
          --json "$RUNNER_TEMP/evals.json"
          --report "$RUNNER_TEMP/evals.html"

      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-evals
          path: |
            ${{ runner.temp }}/evals.json
            ${{ runner.temp }}/evals.html
          if-no-files-found: ignore
          retention-days: 14
