name: Evals

# Evals des skills (ADR-001) : elles appellent un modèle et coûtent du quota, donc
# elles ne tournent que sur les PR de ce dépôt portant le label « evals »,
# jamais sur une PR venant d'un fork.

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

env:
  # Version de Claude Code fixée, à monter à la main
  CLAUDE_CODE_VERSION: 2.1.291

jobs:
  evals:
    name: Evals des skills
    if: >-
      contains(github.event.pull_request.labels.*.name, 'evals')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pdftotext et pdfinfo : lecture des sources PDF de wf-cadrage-besoin, page par page
      - name: Installation de poppler
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Installation de Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      # Deux passes (evals/README.md, section Réseau) : le bac à sable de Bash ne
      # joint que les domaines accordés par WebFetch(domain:…). Chaque cas porte
      # exactement un des tags reseau / hors-reseau (verifier-tags-evals.sh).
      # Chaque cas en échec est relancé une fois, seul (evals-avec-relance.sh) : la CI
      # ne tombe que si un cas échoue deux fois de suite (juges llm bruités).
      # --no-publish : le rapport ne quitte jamais la CI (confidentialité)
      - name: Evals avec registres joignables (tag reseau)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          bash .github/scripts/evals-avec-relance.sh "$RUNNER_TEMP/evals-reseau"
          . --scaffold --trust-plugin --no-publish
          --tag reseau --judge-model sonnet --ablation none
          --allow-tools Write Bash "WebFetch(domain:registry.npmjs.org)" "WebFetch(domain:pub.dev)" "WebFetch(domain:api.osv.dev)"

          --allow-tools Write Bash "WebFetch(domain:registry.npmjs.org)" "WebFetch(domain:pub.dev)"
          "WebFetch(domain:endoflife.date)" "WebFetch(domain:storage.googleapis.com)"

      - name: Evals sans réseau (tag hors-reseau)
        if: success() || failure()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          bash .github/scripts/evals-avec-relance.sh "$RUNNER_TEMP/evals-hors-reseau"
          . --scaffold --trust-plugin --no-publish
          --tag hors-reseau --judge-model sonnet --ablation none
          --allow-tools Write Bash

      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-evals
          path: |
            ${{ runner.temp }}/evals-*.json
          if-no-files-found: ignore
          retention-days: 14
